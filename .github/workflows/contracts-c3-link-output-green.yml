name: Contracts C3 document output acceptance
on:
  push:
    branches: [ci/contracts-c3-link-output-green]
permissions:
  contents: read
env:
  GOPROXY: https://proxy.golang.org|direct
  GOFLAGS: -trimpath
jobs:
  cli:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cgo: [0, 1]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - run: kit-retry 3 5 go mod download
      - name: Document mutation and show output
        run: go test -tags fts5 ./cmd/docbank -run '^(TestContract|TestParty)' -count=1 -v
