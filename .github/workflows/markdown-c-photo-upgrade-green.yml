name: Disposable C photo upgrade GREEN

on:
  push:
    branches: [build/markdown-c-photo-upgrade-green]

permissions:
  contents: read

env:
  SOURCE: 01532ceb9373162812a9a162a5354e1c0e8080d4
  TEST_ONLY: 2f1f1a0aa31e00ca0346491ae73433e223f73cb9
  TEST_BLOB: 0e3ac30fd0485939f2f65d4a6c8e963c0fe25519
  DOCBANK_TELEMETRY_ENABLED: "0"

jobs:
  photo-upgrade-green:
    if: github.repository == 'salmonumbrella/docbank' && github.event_name == 'push' && github.ref == 'refs/heads/build/markdown-c-photo-upgrade-green'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cgo: ["0", "1"]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -trimpath
    steps:
      - name: Check out disposable workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: proof
          fetch-depth: 2
          persist-credentials: false
      - name: Record immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source=%s\ntest_only=%s\ntest_blob=%s\nproof=%s\ncgo=%s\n' "$SOURCE" "$TEST_ONLY" "$TEST_BLOB" "$GITHUB_SHA" "$CGO_ENABLED" > evidence/inputs.txt
          test "$(git -C proof rev-parse HEAD^)" = "$SOURCE"
      - name: Check out exact committed product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 01532ceb9373162812a9a162a5354e1c0e8080d4
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Go from exact product go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Run released upgrade and backup photo restore regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE"
          test "$(git -C source rev-parse HEAD^)" = "$TEST_ONLY"
          test "$(git -C source rev-parse HEAD:internal/store/upgrade_v015_test.go)" = "$TEST_BLOB"
          test "$(git -C source diff --name-only HEAD^ HEAD)" = "internal/store/upgrade_v017.go"
          git -C source diff --exit-code
          go version > evidence/toolchain.txt
          (cd source && go env CGO_ENABLED GOOS GOARCH) >> evidence/toolchain.txt
          set +e
          (cd source && timeout 900s go test -json -tags fts5 ./internal/store/ -run '^(TestUpgradeReleasedV0170PreservesPhotoSuggestions|TestUpgradeReleasedV0170RebuildsNoteCatalog|TestEveryReleasedSchemaFixtureUpgrades|TestPhotoSuggestionBackupKeepsDecisions|TestPhotoSuggestionBackupKeepsCompletion|TestPhotoRotationBackup|TestPhotoRotationRestoreKeepsAcceptedTextSettled)$' -count=1 -timeout=10m) > evidence/go-test.jsonl 2> evidence/go-test.stderr
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/go-test.exit
          git -C source diff --exit-code
      - name: Require executed GREEN in every selected SQLite driver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path('evidence')
          events, non_json = [], []
          for line in (root / 'go-test.jsonl').read_text().splitlines():
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError:
                  non_json.append(line)
          drivers = ['modernc.org/sqlite']
          if os.environ['CGO_ENABLED'] == '1':
              drivers.append('mattn/go-sqlite3')
          drivers.sort()
          upgrade = ['TestUpgradeReleasedV0170PreservesPhotoSuggestions', 'TestUpgradeReleasedV0170RebuildsNoteCatalog']
          every = 'TestEveryReleasedSchemaFixtureUpgrades'
          backups = {'TestPhotoSuggestionBackupKeepsDecisions': 3, 'TestPhotoSuggestionBackupKeepsCompletion': 6,
                     'TestPhotoRotationBackup': 4, 'TestPhotoRotationRestoreKeepsAcceptedTextSettled': 3}
          required = set(upgrade) | {every} | set(backups)
          required |= {p + '/' + d for p in upgrade for d in drivers}
          required |= {every + '/v%d/%s' % (v, d) for v in (28, 29, 41, 48) for d in drivers}
          tests = [e for e in events if e.get('Test')]
          started = {e['Test'] for e in tests if e['Action'] == 'run'}
          passed = {e['Test'] for e in tests if e['Action'] == 'pass'}
          failed = sorted({e['Test'] for e in tests if e['Action'] == 'fail'})
          skipped = sorted({e.get('Test', '<package>') for e in events if e.get('Action') == 'skip'})
          parents = set(upgrade) | {every} | set(backups)
          outside = sorted({e['Test'] for e in tests if e['Test'].split('/')[0] not in parents})
          children = {p: sorted(t for t in passed if t.startswith(p + '/') and '/' not in t[len(p) + 1:]) for p in backups}
          child_counts = {p: len(c) for p, c in children.items()}
          package = [e for e in events if not e.get('Test') and e.get('Package') == 'go.kenn.io/docbank/internal/store' and e.get('Action') in ('pass', 'fail')]
          package_passed = len(package) == 1 and package[0]['Action'] == 'pass'
          exit_code = int((root / 'go-test.exit').read_text())
          output = ''.join(e.get('Output', '') for e in events)
          (root / 'go-test.log').write_text(output)
          missing_run = sorted(required - started)
          missing_pass = sorted(required - passed)
          counts_ok = all(child_counts[p] == n for p, n in backups.items())
          qualified = (exit_code == 0 and package_passed and not failed and not skipped and not non_json
                       and not missing_run and not missing_pass and not outside and counts_ok
                       and 'Received unexpected error:' not in output)
          receipt = dict(source=os.environ['SOURCE'], cgo=os.environ['CGO_ENABLED'], exit_code=exit_code,
                         required=sorted(required), missing_run=missing_run, missing_pass=missing_pass,
                         failed=failed, skipped=skipped, non_json=non_json, outside_selection=outside,
                         backup_subtests_passed=child_counts, package_passed=package_passed,
                         expected_green_qualified=qualified)
          (root / 'result.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          if not qualified:
              raise SystemExit('Expected executed photo-upgrade GREEN did not qualify')
          PYTHON
      - name: Upload raw GREEN logs and qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c-photo-upgrade-green-cgo${{ matrix.cgo }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  prek-pre-push:
    if: github.repository == 'salmonumbrella/docbank' && github.event_name == 'push' && github.ref == 'refs/heads/build/markdown-c-photo-upgrade-green'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out disposable workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: proof
          fetch-depth: 2
          persist-credentials: false
      - name: Record immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'source=%s\nproof=%s\nprek=0.5.10\ngolangci_lint=v2.15.0\n' "$SOURCE" "$GITHUB_SHA" > evidence/inputs.txt
          test "$(git -C proof rev-parse HEAD^)" = "$SOURCE"
      - name: Check out exact committed product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 01532ceb9373162812a9a162a5354e1c0e8080d4
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Go from exact product go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Install pinned prek and golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/prek-venv"
          "$RUNNER_TEMP/prek-venv/bin/pip" install --disable-pip-version-check prek==0.5.10
          echo "$RUNNER_TEMP/prek-venv/bin" >> "$GITHUB_PATH"
          GOBIN="$RUNNER_TEMP/gobin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
      - name: Run ordinary pre-push hooks on exact product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE"
          git -C source diff --exit-code
          { prek --version; golangci-lint --version; go version; } > evidence/toolchain.txt 2>&1
          test "$(prek --version | awk '{print $2}')" = "0.5.10"
          set +e
          (cd source && timeout 2400s prek run --stage pre-push --all-files --color never) > evidence/prek.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > evidence/prek.exit
          cat evidence/prek.log
          git -C source status --porcelain > evidence/status.txt
          git -C source diff --exit-code
      - name: Require every configured pre-push hook to have run and passed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          root = Path('evidence')
          log = (root / 'prek.log').read_text()
          exit_code = int((root / 'prek.exit').read_text())
          status = (root / 'status.txt').read_text()
          hooks = ['go-fmt', 'go-lint', 'huma-check']
          passed = {h: bool(re.search(r'^' + re.escape(h) + r'\.+Passed$', log, re.M)) for h in hooks}
          skipped_forbid = bool(re.search(r'^forbid-superpowers-artifacts\.+.*Skipped$', log, re.M))
          failed = bool(re.search(r'^\S+\.+Failed$', log, re.M))
          qualified = exit_code == 0 and all(passed.values()) and not failed and not status.strip()
          receipt = dict(source=os.environ['SOURCE'], exit_code=exit_code, hooks_passed=passed,
                         forbid_superpowers_artifacts_skipped_no_files=skipped_forbid,
                         failed_marker=failed, clean_status=not status.strip(), expected_green_qualified=qualified)
          (root / 'result.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          if not qualified:
              raise SystemExit('Hosted pre-push hooks did not qualify')
          PYTHON
      - name: Upload raw pre-push logs and qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c-photo-upgrade-prek-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
