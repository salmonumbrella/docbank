name: Contracts C1 schema marker discovery

on:
  push:
    branches: [ci/contracts-c1-marker-discovery]

permissions:
  contents: read

jobs:
  marker:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cgo: [0, 1]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOPROXY: https://proxy.golang.org|direct
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - name: Download modules
        run: kit-retry 3 5 go mod download
      - name: Discover schema contract
        shell: bash
        run: |
          set -o pipefail
          go test -v -tags fts5 ./internal/store -run '^TestStorageSchemaVersionContract$' -count=1 2>&1 | tee marker.log
      - name: Upload raw log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: marker-cgo-${{ matrix.cgo }}
          path: marker.log
          if-no-files-found: warn
