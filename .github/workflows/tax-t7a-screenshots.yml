name: Tax T7a screenshots artifact

on:
  push:
    branches: [build/tax-t7a-screenshots]

permissions:
  contents: read

env:
  GOTRACEBACK: all
  GOPROXY: https://proxy.golang.org|direct
  GOFLAGS: -trimpath

jobs:
  taxes-browser-screenshots:
    if: github.repository == 'salmonumbrella/docbank'
    name: Taxes page screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install Chromium
        run: |
          # Match runner-images' bounded mirror failover, including Playwright's apt calls.
          # https://github.com/actions/runner-images/issues/14594
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zz-retries
          kit-retry 3 5 npm --prefix frontend ci
          kit-retry 3 5 node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Embed frontend and capture the Taxes page
        env:
          CGO_ENABLED: "1"
          DOCBANK_TELEMETRY_ENABLED: "0"
        run: |
          npm --prefix frontend run build
          find internal/web/dist -mindepth 1 ! -name .keep -exec rm -rf {} +
          cp -R frontend/dist/. internal/web/dist/
          scratch="$RUNNER_TEMP/taxes-capture"
          mkdir -p "$scratch"
          go build -tags fts5 -o "$scratch/docbank" ./cmd/docbank
          # The spec seeds its own mkdtemp vault and stops its daemon in dispose().
          DOCBANK_SCREENSHOT_BINARY="$scratch/docbank" \
          DOCBANK_TAXES_SCREENSHOT_DIR="$GITHUB_WORKSPACE/.superpowers/taxes-shots" \
          PLAYWRIGHT_JSON_OUTPUT_FILE="$scratch/report.json" \
            node frontend/node_modules/@playwright/test/cli.js test taxes.screenshot.ts \
              --config frontend/screenshots/playwright.config.ts --project chromium \
              --retries 0 --reporter line,json
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const { expected, unexpected, flaky, skipped } = report.stats;
            const got = { expected, unexpected, flaky, skipped, errors: report.errors.length };
            const want = { expected: 1, unexpected: 0, flaky: 0, skipped: 0, errors: 0 };
            if (JSON.stringify(got) !== JSON.stringify(want)) {
              console.error(`Taxes capture must execute one passing case: ${JSON.stringify(got)}`);
              process.exit(1);
            }
            console.log("taxes: executed=1 passed=1 skipped=0 failed=0");
          ' "$scratch/report.json"
      - name: Upload Taxes screenshots
        uses: actions/upload-artifact@v7.0.2
        with:
          name: taxes-screenshots-attempt-${{ github.run_attempt }}
          path: .superpowers/taxes-shots/*.png
          # The capture directory is hidden, which the action skips by default.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
