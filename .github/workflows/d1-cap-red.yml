name: D1 capped regression RED
on:
  push:
    branches: [scratch/d1-cap-red-14694e5]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgo: '0'
            package: ./internal/docusealclient/
            test: '^TestTemplatesEmptyNameUsesPlaceholder$'
          - cgo: '1'
            package: ./internal/docusealclient/
            test: '^TestTemplatesEmptyNameUsesPlaceholder$'
          - cgo: '0'
            package: ./cmd/docbank/
            test: '^TestContractSignTemplateNameEscapesBidi$'
          - cgo: '1'
            package: ./cmd/docbank/
            test: '^TestContractSignTemplateNameEscapesBidi$'
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -tags fts5 -count=1 -v '${{ matrix.package }}' -run '${{ matrix.test }}'
