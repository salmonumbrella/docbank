name: Contracts C5 combined checks and media

on:
  push:
    branches: [ci/contracts-c5-visual-r2]

permissions:
  contents: read

env:
  C5_SOURCE: 3db24d891dbbb2119c3db09e437bc5dc8dee5b69
  C5_BASE: 3f9b41f373af8ff9f7852de4f65fe41bc74107cc

jobs:
  frontend-docs:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - run: kit-retry 3 5 npm ci --prefix frontend
      - name: Regenerate the API from source
        run: |
          mkdir -p .superpowers/openapi
          cat > .superpowers/openapi/main.go <<'GO'
          package main
          import (
              "os"
              "go.kenn.io/docbank/internal/api"
          )
          func main() {
              out, err := api.OpenAPIYAML()
              if err != nil { panic(err) }
              if _, err := os.Stdout.Write(out); err != nil { panic(err) }
          }
          GO
          go run -tags fts5 ./.superpowers/openapi > internal/api/openapi.yaml
      - run: make generate-photo-policy
      - run: go run github.com/doordash-oss/oapi-codegen-dd/v3/cmd/oapi-codegen@v3.76.5 --config scripts/oapi-codegen/config.yaml internal/api/openapi.yaml
      - run: npm --prefix frontend run generate:api
      - name: Generated files match the committed source
        run: git diff --exit-code -- internal/api/openapi.yaml internal/apiclient/client.gen.go frontend/src/generated/docbank.ts frontend/src/generated/photoSourceExtensions.ts
      - name: Record formatter changes
        if: always()
        run: |
          (cd frontend && npx vp fmt)
          git diff -- frontend > format.patch
          git diff --stat -- frontend
          git checkout -- frontend
          printf 'workflow %s\nsource %s\n' "${{ github.sha }}" "$C5_SOURCE" > format-pin.txt
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: contracts-c5-format-${{ github.sha }}
          path: |
            format.patch
            format-pin.txt
          if-no-files-found: error
      - name: Frontend checks (make frontend-test)
        if: always()
        run: make frontend-test
      # make stops at the first failing step; the later checks still run so a
      # format-only failure cannot hide a type, kit, unit or build failure.
      - name: Svelte and TypeScript check
        if: always()
        run: npm --prefix frontend run check
      - name: Kit UI check
        if: always()
        run: npm --prefix frontend run check:kit-ui
      - name: Screenshot harness check
        if: always()
        run: npm --prefix frontend run screenshots:check
      - name: Unit tests
        if: always()
        run: npm --prefix frontend test
      - name: Build
        if: always()
        run: npm --prefix frontend run build
      - name: Restore pinned uv archive
        if: always()
        id: uv_archive
        uses: actions/cache/restore@v6.1.0
        with:
          path: .vercel-tools/downloads
          key: release-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/vercel-install-docs.sh') }}
      - name: Install pinned documentation tools
        if: always()
        run: |
          kit-retry 3 5 ./scripts/vercel-install-docs.sh
          echo "$PWD/.vercel-tools/bin" >> "$GITHUB_PATH"
      - name: Strict docs
        if: always()
        run: make docs-build

  go-browser:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cgo: ['0', '1']
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Browser session and web page routes
        run: go test -tags fts5 ./internal/api/ -run 'TestWebPages|TestWebSession' -count=1
      - name: Contract and party API routes
        if: always()
        run: go test -tags fts5 ./internal/api/ -run 'Contract|Part(y|ies)' -count=1

  screenshots:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - name: Install pinned Chromium and ffmpeg
        run: |
          kit-retry 3 5 npm ci --prefix frontend
          kit-retry 3 5 node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
          kit-retry 3 5 sudo apt-get update
          kit-retry 3 5 sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build the branch
        run: make build
      - name: Build the qualified C4 parent for Before captures
        run: |
          git worktree add --detach .superpowers/base "$C5_BASE"
          make -C .superpowers/base build
      - name: Capture synthetic real-daemon media
        env:
          DOCBANK_SCREENSHOT_DIR: ${{ github.workspace }}/.superpowers/contracts-c5-shots
          DOCBANK_C5_BASE_BIN: ${{ github.workspace }}/.superpowers/base/bin/docbank
          DOCBANK_PLAYWRIGHT_SUITE: contracts-c5
        run: |
          scratch=$(mktemp -d /tmp/docbank-screenshots-XXXXXX)
          trap 'rm -rf "$scratch"' EXIT
          cd frontend
          TMPDIR="$scratch" node node_modules/@playwright/test/cli.js test contracts-c5.screenshot.ts --config screenshots/playwright.config.ts --project chromium
      - name: Encode the recording as H.264
        if: always()
        run: |
          shots=.superpowers/contracts-c5-shots
          # The test saves only the attempt that completed the whole sequence.
          webm="$shots/recording.webm"
          test -s "$webm" || { echo "no completed recording"; exit 1; }
          start=$(cat "$shots/recording-start.txt")
          ffmpeg -y -loglevel error -ss "$start" -i "$webm" -c:v libx264 -pix_fmt yuv420p -preset slow -crf 20 -movflags +faststart "$shots/contracts-c5.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of default=nw=1 "$shots/contracts-c5.mp4" | tee "$shots/mp4-probe.txt"
          mkdir -p "$shots/frames"
          ffmpeg -y -loglevel error -i "$shots/contracts-c5.mp4" -vf fps=1 "$shots/frames/frame-%03d.png"
      - name: Record source and workflow pin
        if: always()
        run: |
          mkdir -p .superpowers/contracts-c5-shots
          printf 'workflow %s\nsource %s\nbase %s\nrunner_scale %s\n' "${{ github.sha }}" "$C5_SOURCE" "$C5_BASE" "${DOCBANK_SCREENSHOT_SCALE:-1}" > .superpowers/contracts-c5-shots/pin.txt
          (cd .superpowers/contracts-c5-shots && find . -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.json' -o -name '*.png' \) -print0 | sort -z | xargs -0 -r sha256sum) >> .superpowers/contracts-c5-shots/pin.txt
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: contracts-c5-media-${{ github.sha }}
          if-no-files-found: warn
          path: |
            .superpowers/contracts-c5-shots/
            .superpowers/playwright/
            frontend/test-results/playwright/contracts-c5.json

  lint:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore lint cache
        uses: ./.github/actions/go-cache-restore
        with:
          group: linux-lint
          extra-path: ~/.cache/golangci-lint
      - name: Reject timing suppressions
        run: make check-timing-suppressions
      - name: Run golangci-lint
        uses: step-security/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          skip-cache: true
      - name: Run golangci-lint for Windows
        if: always()
        env:
          GOOS: windows
        run: ./custom-gcl run ./...
      - name: Run golangci-lint for macOS
        if: always()
        env:
          GOOS: darwin
        run: ./custom-gcl run ./...
      - name: Check workflow retry rules
        if: always()
        run: make lint-workflow-retries
