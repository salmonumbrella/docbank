name: Vault-wide reuse 50k warm acceptance
on:
  push:
    branches: [verification/vault-wide-reuse-acceptance-1136]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve exact verification inputs
        run: |
          cp .github/verification/reuse-focused-overlay.json "$RUNNER_TEMP/reuse-focused-overlay.json"
          cp .github/verification/run-reuse-focused.py "$RUNNER_TEMP/run-reuse-focused.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: salmonumbrella/docbank
          ref: da40a73d906e02c957a71de2b196384036e3c08d
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Run pinned focused verification
        run: python3 "$RUNNER_TEMP/run-reuse-focused.py"
      - name: Remove verification inputs
        if: always()
        run: rm -f -- "$RUNNER_TEMP/reuse-focused-overlay.json" "$RUNNER_TEMP/run-reuse-focused.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reuse-focused-results
          path: ${{ runner.temp }}/reuse-focused-evidence/
          if-no-files-found: error
          retention-days: 7
