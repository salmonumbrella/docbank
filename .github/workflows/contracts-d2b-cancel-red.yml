name: Contracts D2b cancellation route RED
on:
  push:
    branches: [ci/contracts-d2b-cancel-red-30326b19f]
permissions:
  contents: read
jobs:
  api:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cgo: [0, 1]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - run: kit-retry 3 5 go mod download
      - name: Cancellation route assertions
        run: go test -v -tags fts5 ./internal/api -run '^TestSignatureCancellationConfirmedAndRevisionFence$' -count=1
      - name: Existing signature creation controls
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/api -run '^TestSignatureRequest(DisclosesOnlySigners|UncertainCreationKeepsLocalHistory)$' -count=1
