name: Contracts C3 final overflow acceptance
on:
  push:
    branches: [ci/contracts-c3-overflow-final-acceptance]
permissions:
  contents: read
env:
  GOPROXY: https://proxy.golang.org|direct
  GOFLAGS: -trimpath
jobs:
  focused:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cgo: [0, 1]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - name: Download modules
        run: kit-retry 3 5 go mod download
      - name: Schema contract tests
        run: go test -tags fts5 ./internal/store -run '^TestStorageSchema' -count=1 -v
      - name: Store and released upgrade
        if: always()
        run: go test -tags fts5 ./internal/store -run '^(TestParty|TestContract|TestEveryReleasedSchemaFixtureUpgrades|TestOpenCutsOverReleased|TestOpenCutsOverEveryReleased|TestFreshStoresRecordCurrentStorageSchemaVersion|TestUpgradeReleased|TestReleasedSchema|TestPhotoFaceUndoRetiresUnusedCreatedPerson|TestPhotoSuggestionBackupKeepsDecisions|TestPhotoSuggestionBackupKeepsCompletion|TestPhotoRotationBackup)' -count=1 -v
      - name: SQLite party, contract and metadata backend contracts
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/(organization|metadata-export)/(Party|Contract|MetadataExportRecovery)' -count=1 -v
      - name: SQLite document lifecycle, history and high-water
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/organization/ContractDocument(NodeHighWater|History|Lifecycle|ConcurrentFence)$' -count=1 -v
      - name: SQLite party revision exhaustion
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/organization/PartyRevisionExhaustion$' -count=1 -v
      - name: SQLite contract revision exhaustion
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/organization/ContractRevisionExhaustion$' -count=1 -v
      - name: SQLite contract document revision exhaustion
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/organization/ContractDocumentRevisionExhaustion$' -count=1 -v
      - name: Party and contract API
        if: always()
        run: go test -tags fts5 ./internal/api -run '^(TestParty|TestContract)' -count=1 -v
      - name: Party and contract daemon client
        if: always()
        run: go test -tags fts5 ./internal/daemonconn -run '^(TestParty|TestContract)' -count=1 -v
      - name: Party and contract CLI
        if: always()
        run: go test -tags fts5 ./cmd/docbank -run '^(TestParty|TestContract)' -count=1 -v
      - name: Confirmed create output failure
        if: always()
        run: go test -tags fts5 ./cmd/docbank -run '^TestContractCreateReportsConfirmedOutputFailure$' -count=1 -v

  postgres:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: docbank_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: docbank_test
          PGDATA: /pgdata/data
        ports: ['5432:5432']
        options: >-
          --tmpfs /pgdata
          --health-cmd "pg_isready -h 127.0.0.1 -U docbank_test -d docbank_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOCBANK_TEST_POSTGRES_DSN: postgres://docbank_test@127.0.0.1:5432/docbank_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - run: kit-retry 3 5 go mod download
      - name: PostgreSQL schema lifecycle
        run: go test -tags fts5 ./internal/store/pgschema -count=1 -v
      - name: PostgreSQL party, contract and metadata backend contracts
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/(organization|metadata-export)/(Party|Contract|MetadataExportRecovery)' -count=1 -v
      - name: PostgreSQL document lifecycle, history and high-water
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/organization/ContractDocument(NodeHighWater|History|Lifecycle|ConcurrentFence)$' -count=1 -v
      - name: PostgreSQL party revision exhaustion
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/organization/PartyRevisionExhaustion$' -count=1 -v
      - name: PostgreSQL contract revision exhaustion
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/organization/ContractRevisionExhaustion$' -count=1 -v
      - name: PostgreSQL contract document revision exhaustion
        if: always()
        run: go test -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/organization/ContractDocumentRevisionExhaustion$' -count=1 -v
  generated:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - run: kit-retry 3 5 npm ci --prefix frontend
      - name: Regenerate and compare canonical artifacts
        run: |
          make generate-api
          for file in internal/api/openapi.yaml internal/apiclient/client.gen.go frontend/src/generated/docbank.ts frontend/src/generated/photoSourceExtensions.ts; do
            git show 478a14314880264f3991365d824432c4428b2e41:"$file" > "$RUNNER_TEMP/canonical"
            cmp "$RUNNER_TEMP/canonical" "$file"
          done
  docs:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - name: Install pinned documentation tools
        run: |
          kit-retry 3 5 ./scripts/vercel-install-docs.sh
          echo "$PWD/.vercel-tools/bin" >> "$GITHUB_PATH"
      - run: make docs-build
  lint:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-lint
          extra-path: ~/.cache/golangci-lint
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - name: Check workflow retries
        run: |
          GOFLAGS="${GOFLAGS:+$GOFLAGS }-n" kit-retry 3 5 make lint-workflow-retries
          make lint-workflow-retries
      - name: Reject timing suppressions
        if: always()
        run: make check-timing-suppressions
      - name: Linux lint
        if: always()
        uses: step-security/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          skip-cache: true
      - name: Windows lint
        if: always()
        env:
          GOOS: windows
        run: ./custom-gcl run ./...
      - name: macOS lint
        if: always()
        env:
          GOOS: darwin
        run: ./custom-gcl run ./...
