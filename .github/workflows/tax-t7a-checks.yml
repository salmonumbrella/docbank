name: Tax T7a focused web checks

on:
  push:
    branches: [build/tax-t7a-checks]

permissions:
  contents: read

env:
  GOTRACEBACK: all
  GOPROXY: https://proxy.golang.org|direct
  GOFLAGS: -trimpath

jobs:
  web:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - name: Install locked dependencies
        id: install
        run: kit-retry 3 5 npm --prefix frontend ci
      - name: Format and lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix frontend run check:fmt-lint
      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix frontend run check
      - name: Kit UI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix frontend run check:kit-ui
      - name: Screenshot contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix frontend run screenshots:check
      - name: Focused web tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix frontend test -- src/taxMoney.test.ts src/taxesView.test.ts src/Taxes.test.ts src/App.pages.test.ts src/app-opened.test.ts
      - name: Web page route
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: go test -tags fts5 ./internal/api -run '^(TestWebPages|TestWebSessionAllowsOnlyTaxListReads)$'
