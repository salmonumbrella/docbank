name: Contracts C2 cap green

on:
  push:
    branches:
      - build/contracts-c2-cap-green

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cgo: ["0", "1"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run focused contract CLI regression
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -tags fts5 ./cmd/docbank -run '^TestContractCLIWalkAndPreflight$' -count=1
