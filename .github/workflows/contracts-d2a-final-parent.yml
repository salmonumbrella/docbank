name: Contracts D2a overflow repair acceptance
on:
  push:
    branches: [ci/contracts-d2a-final-parent-d6df98308]
permissions:
  contents: read
env:
  GOPROXY: https://proxy.golang.org|direct
jobs:
  generated:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: kit-retry 3 5 npm ci --prefix frontend
      - name: Pin generated bytes to the qualified 9dd02a02b source
        id: pin
        run: |
          cat > /tmp/generated.sha256 <<'SUMS'
          cb0ae02bef2fe31a954eeb758bdc5077a30de61ce62dc4454e8c532b13180867  internal/api/openapi.yaml
          32161f6c18c4f77a36e2e6248a8214156ca34c7c021e2142c15bcca12f331c6d  internal/apiclient/client.gen.go
          5a8e5e5ff292829cab97f5444f0e07e78adf2c57c3adb7a9a3417f5365a8b559  frontend/src/generated/docbank.ts
          0a5a98ac62c41cf7b67c416433ce30a6f39513a4e538dce9410a0dad57d05867  frontend/src/generated/photoSourceExtensions.ts
          SUMS
          sha256sum -c /tmp/generated.sha256
      - name: Render integrated API without generated client dependency
        id: render
        run: |
          cp internal/api/openapi.yaml /tmp/import-openapi.yaml
          cp internal/apiclient/client.gen.go /tmp/import-client.go
          cp frontend/src/generated/docbank.ts /tmp/import-client.ts
          cp frontend/src/generated/photoSourceExtensions.ts /tmp/import-photo.ts
          mkdir -p .superpowers/openapi
          cat > .superpowers/openapi/main.go <<'GO'
          package main
          import (
              "os"
              "go.kenn.io/docbank/internal/api"
          )
          func main() {
              out, err := api.OpenAPIYAML()
              if err != nil { panic(err) }
              if _, err := os.Stdout.Write(out); err != nil { panic(err) }
          }
          GO
          go run -tags fts5 ./.superpowers/openapi > internal/api/openapi.yaml
          make generate-photo-policy
          go run github.com/doordash-oss/oapi-codegen-dd/v3/cmd/oapi-codegen@v3.76.5 --config scripts/oapi-codegen/config.yaml internal/api/openapi.yaml
          npm --prefix frontend run generate:api
          cmp /tmp/import-openapi.yaml internal/api/openapi.yaml
          cmp /tmp/import-client.go internal/apiclient/client.gen.go
          cmp /tmp/import-client.ts frontend/src/generated/docbank.ts
          cmp /tmp/import-photo.ts frontend/src/generated/photoSourceExtensions.ts
          sha256sum -c /tmp/generated.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: contracts-d2a-generated-d6df98308-${{ github.sha }}
          if-no-files-found: error
          path: |
            internal/api/openapi.yaml
            internal/apiclient/client.gen.go
            frontend/src/generated/docbank.ts
            frontend/src/generated/photoSourceExtensions.ts
      - name: Generated-source drift
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          cp internal/api/openapi.yaml /tmp/d2a-openapi.yaml
          cp internal/apiclient/client.gen.go /tmp/d2a-client.go
          cp frontend/src/generated/docbank.ts /tmp/d2a-client.ts
          cp frontend/src/generated/photoSourceExtensions.ts /tmp/d2a-photo.ts
          make generate-api
          npm --prefix frontend run generate:api
          cmp /tmp/d2a-openapi.yaml internal/api/openapi.yaml
          cmp /tmp/d2a-client.go internal/apiclient/client.gen.go
          cmp /tmp/d2a-client.ts frontend/src/generated/docbank.ts
          cmp /tmp/d2a-photo.ts frontend/src/generated/photoSourceExtensions.ts
          sha256sum -c /tmp/generated.sha256
      - name: Restore pinned uv archive
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: .vercel-tools/downloads
          key: release-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/vercel-install-docs.sh') }}
      - name: Install strict documentation tools
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          kit-retry 3 5 ./scripts/vercel-install-docs.sh
          echo "$PWD/.vercel-tools/bin" >> "$GITHUB_PATH"
      - name: Build documentation
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: make docs-build

  sqlite:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cgo: [0, 1]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: kit-retry 3 5 go mod download
      - name: Own store SignatureRevisionExhaustion regression
        run: go test -v -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/organization/SignatureRevisionExhaustion$' -count=1
      - name: Own service revision exhaustion regression
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/contractsign -run '^TestSignatureRequestContractRevisionExhaustion$' -count=1
      - name: Inherited revision exhaustion families
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/organization/(Party|Contract)RevisionExhaustion$' -count=1
      - name: API provider daemon and CLI
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/docusealclient ./internal/api ./internal/daemonconn ./cmd/docbank -run 'Signature|Submission|TestEnsureDiscoveryRejectsProtocolMismatch|TestContractCreateReportsConfirmedOutputFailure'
      - name: Full signature service
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/contractsign
      - name: Schema contract
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/store -run '^TestStorageSchema(VersionContract|ContractRecords|TokenDigest|CatalogChanges|ContractChanges|NonUniqueIndexChanges)$'
      - name: Signature store and SQLite parity
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/store -run 'TestSignature|TestBackendContractsSQLite/organization/Signature'
      - name: Metadata export recovery
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/store -run '^TestBackendContractsSQLite/metadata-export/MetadataExportRecovery'

  postgres:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: docbank_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: docbank_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U docbank_test -d docbank_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOCBANK_TEST_POSTGRES_DSN: postgres://docbank_test@127.0.0.1:5432/docbank_test?sslmode=disable
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-cgo
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: kit-retry 3 5 go mod download
      - name: Own native store SignatureRevisionExhaustion regression
        run: go test -v -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/organization/SignatureRevisionExhaustion$' -count=1
      - name: Inherited native revision exhaustion families
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/organization/(Party|Contract)RevisionExhaustion$' -count=1
      - name: Native schema
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/store/pgschema
      - name: Native Party Contract and Signature operations
        if: ${{ !cancelled() }}
        run: go test -v -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/organization/(Party|Contract|Signature)'
      - name: Native metadata
        if: ${{ !cancelled() }}
        run: |
          go test -v -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/metadata-export/(MetadataExportRecovery|MetadataBackupAuthority|MetadataRetainedCatalogs)'
          go test -v -tags fts5 ./internal/store -run '^TestBackendContractsPostgres/enrollment/AuditEnrollmentCatalogs'
      - name: Backend coverage
        if: ${{ !cancelled() }}
        run: make backend-coverage

  lint:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-restore
        with:
          group: linux-lint
          extra-path: ~/.cache/golangci-lint
      - name: Reject timing suppressions
        run: make check-timing-suppressions
      - name: Run golangci-lint
        uses: step-security/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          skip-cache: true
      - name: Run golangci-lint for Windows
        if: ${{ !cancelled() }}
        env:
          GOOS: windows
        run: ./custom-gcl run ./...
      - name: Run golangci-lint for macOS
        if: ${{ !cancelled() }}
        env:
          GOOS: darwin
        run: ./custom-gcl run ./...

  workflow-retry-check:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Check workflow download retries
        run: make lint-workflow-retries
