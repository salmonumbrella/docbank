name: Native C profile da40a73

on:
  push:
    branches:
      - verification/native-profile-587276d

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: verification
          persist-credentials: false

      - name: Copy the isolated diagnostic inputs
        shell: bash
        run: |
          input_dir="$RUNNER_TEMP/docbank-native-profile-inputs"
          mkdir -p "$input_dir"
          cp verification/.github/verification/native-profile/diagnostic_test.go "$input_dir/"
          cp verification/.github/verification/native-profile/overlay.json "$input_dir/"
          cp verification/.github/verification/native-profile/runner.py "$input_dir/"
          cp verification/.github/verification/native-profile/report.md "$input_dir/"

      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: salmonumbrella/docbank
          ref: da40a73d906e02c957a71de2b196384036e3c08d
          path: candidate
          persist-credentials: false

      - name: Set up Go from the candidate module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: candidate/go.mod
          cache: false

      - name: Run one guarded native profile with two-CPU affinity
        shell: bash
        run: |
          command -v taskset >/dev/null
          cpu_list="$(python3 -c 'import os; cpus=sorted(os.sched_getaffinity(0)); print(",".join(map(str, cpus[:2])))')"
          test -n "$cpu_list"
          taskset --cpu-list "$cpu_list" python3 "$RUNNER_TEMP/docbank-native-profile-inputs/runner.py" \
            --repo "$GITHUB_WORKSPACE/candidate" \
            --expected-sha da40a73d906e02c957a71de2b196384036e3c08d

      - name: Remove copied diagnostic inputs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          input_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "docbank-native-profile-inputs"
          for name in ("diagnostic_test.go", "overlay.json", "runner.py", "report.md"):
              (input_dir / name).unlink(missing_ok=True)
          try:
              input_dir.rmdir()
          except FileNotFoundError:
              pass
          PY
