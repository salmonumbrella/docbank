name: Contracts C4 review regressions (expected RED)

on:
  push:
    branches: [bootstrap/contracts-c4-red-r1-20261112]

permissions:
  contents: read

jobs:
  regressions:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - run: kit-retry 3 5 npm ci --prefix frontend
      - name: Early civil years
        if: always()
        working-directory: frontend
        run: npx vp test run src/contracts.test.ts -t "keeps API years below 100" --reporter=verbose
      - name: Repeated live row
        if: always()
        working-directory: frontend
        run: npx vp test run src/ContractsPage.test.ts -t "shows a contract once when a later live page repeats it" --reporter=verbose
      - name: Failed refresh on the open contract
        if: always()
        working-directory: frontend
        run: npx vp test run src/ContractsPage.test.ts -t "shows a failed refresh on the open contract and retries it" --reporter=verbose
      - name: Remaining contracts tests
        if: always()
        working-directory: frontend
        run: npx vp test run src/contracts.test.ts src/ContractsPage.test.ts --reporter=verbose
