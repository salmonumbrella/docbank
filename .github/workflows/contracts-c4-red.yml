name: Contracts C4 round 2 regressions (expected RED)

on:
  push:
    branches: [bootstrap/contracts-c4-red-r2-20261112]

permissions:
  contents: read

jobs:
  regressions:
    if: github.repository == 'salmonumbrella/docbank'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
      - run: kit-retry 3 5 npm ci --prefix frontend
      - name: Distinct type labels
        if: always()
        working-directory: frontend
        run: npx vp test run src/contracts.test.ts -t "gives every valid type a visible label distinct from the others" --reporter=verbose
      - name: Chosen status window caption
        if: always()
        working-directory: frontend
        run: npx vp test run src/ContractsPage.test.ts -t "computes the window from the daemon date and skips pages of expired rows" --reporter=verbose
      - name: Affected contracts test files
        if: always()
        working-directory: frontend
        run: npx vp test run src/contracts.test.ts src/ContractsPage.test.ts --reporter=verbose
